# docker-compose.yaml

services:
  watermwark:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: watermwark

    ports:
      - "7860:7860"

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config.json:/app/config.json

    environment:
      PYTHONUNBUFFERED: "1"

    stdin_open: true
    tty: true

    command:
      [
        "python",
        "main.py",
        "--program",
        "visual",
        "--host",
        "0.0.0.0",
        "--port",
        "7860"
      ]